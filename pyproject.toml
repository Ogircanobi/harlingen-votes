[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harlingen-votes"
version = "0.1.0"
description = "Voting records of the Harlingen, TX City Commission, extracted from the City's published minutes."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pdfplumber>=0.11",
    "pypdf>=4.2",
    "tenacity>=8.2",
    "python-dateutil>=2.9",
    "anthropic>=0.40",
]

[project.optional-dependencies]
recon = ["playwright>=1.44"]

[project.scripts]
hvotes = "hvotes.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
